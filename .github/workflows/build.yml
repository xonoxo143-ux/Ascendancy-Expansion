name: Ascendancy build
on:
  push:
    branches: ['1.21.1']
  pull_request:
    branches: ['1.21.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/main/generation/.node-version
          cache: npm
          cache-dependency-path: src/main/generation/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge mod
        run: |
          chmod +x gradlew scripts/generate-assets.sh
          ./gradlew --no-daemon --stacktrace build -x signJar
      - name: Stage JAR with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test "$(find build/libs -maxdepth 1 -name 'projectexpansion-*.jar' | wc -l)" -eq 1
          cp build/libs/projectexpansion-*.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ascendancy-expansion-build
          path: dist/
          retention-days: 14
          if-no-files-found: error
