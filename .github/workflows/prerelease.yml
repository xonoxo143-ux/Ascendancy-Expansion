name: Ascendancy prerelease
on:
  push:
    tags: ['asc-v*']
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag version and source branch
        shell: bash
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^mod_version=//p' gradle.properties | head -1)"
          tag="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^asc-v//')"
          test "$tag" = "$declared"
          git fetch origin 1.21.1
          git merge-base --is-ancestor HEAD origin/1.21.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/main/generation/.node-version
          cache: npm
          cache-dependency-path: src/main/generation/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release JAR
        run: |
          chmod +x gradlew scripts/generate-assets.sh
          ./gradlew --no-daemon --stacktrace build
      - name: Stage release with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test "$(find build/libs -maxdepth 1 -name 'projectexpansion-*.jar' | wc -l)" -eq 1
          cp build/libs/projectexpansion-*.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS)
      - name: Publish only as TEST prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          draft: false
          body: |
            Minecraft 1.21.1 / NeoForge TEST build.
            This fork replaces the original ProjectExpansion JAR; do not install both.
            Test in a separate or safeguarded world before promoting.
            To promote after verification, edit this SAME release and uncheck the
            prerelease option. Do not rebuild; SHA256SUMS must stay identical.
            Based on MIT-licensed Project Expansion by Donovan_DMC.
          files: |
            dist/*.jar
            dist/SHA256SUMS
          fail_on_unmatched_files: true
